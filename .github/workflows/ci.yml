name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint prose
        run: npm run lint:prose
      - name: Typecheck
        run: npm run typecheck
      - name: Build packages
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Build documentation
        run: npm run docs:build
      - name: Check documentation links
        run: npm run docs:links
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: packages/core
      - name: Run Chromium end-to-end tests
        run: npm run e2e -- --project=chromium
        working-directory: packages/core
        env:
          CI: true
      - name: Upload Playwright traces and report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-report
          path: |
            packages/core/test-results/
            packages/core/playwright-report/
          if-no-files-found: ignore
