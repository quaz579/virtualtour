<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>VirtualTour overlay fixture</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      .abs {
        position: absolute;
        box-sizing: border-box;
        margin: 0;
      }
      #t1 {
        left: 40px;
        top: 40px;
        width: 160px;
        height: 40px;
      }
      #t2 {
        left: 40px;
        top: 260px;
        width: 160px;
        height: 40px;
      }
      #x1 {
        left: 760px;
        top: 40px;
        width: 100px;
        height: 40px;
      }
      #x2 {
        left: 920px;
        top: 40px;
        width: 100px;
        height: 40px;
      }
      #nest {
        left: 760px;
        top: 200px;
        width: 220px;
        height: 90px;
        background: #e8eef7;
      }
      #nest-inner {
        left: 20px;
        top: 20px;
        width: 100px;
        height: 36px;
      }
      #scroller {
        left: 40px;
        top: 500px;
        width: 240px;
        height: 100px;
        overflow: auto;
        border: 0;
        background: #f2f2f2;
      }
      #scroller li {
        list-style: none;
        height: 40px;
        box-sizing: border-box;
        border-bottom: 1px solid #ccc;
        padding: 10px;
      }
      #scroller ul {
        margin: 0;
        padding: 0;
      }
      #outside {
        left: 1000px;
        top: 500px;
        width: 160px;
        height: 40px;
      }
      #start {
        left: 600px;
        top: 700px;
      }
    </style>
  </head>
  <body>
    <button id="t1" class="abs" type="button" data-count="0">Target one</button>
    <button id="t2" class="abs" type="button" data-count="0">Target two</button>
    <button id="x1" class="abs extra" type="button" data-count="0">Extra one</button>
    <button id="x2" class="abs extra" type="button" data-count="0">Extra two</button>
    <div id="nest" class="abs nest">
      <button id="nest-inner" class="abs nest-inner" type="button" data-count="0">Inner</button>
    </div>
    <div id="scroller" class="abs">
      <ul>
        <li id="li-1">Item 1</li>
        <li id="li-2">Item 2</li>
        <li id="li-3">Item 3</li>
        <li id="li-4">Item 4</li>
        <li id="li-5">Item 5</li>
      </ul>
    </div>
    <button id="outside" class="abs" type="button" data-count="0">Outside page button</button>

    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
