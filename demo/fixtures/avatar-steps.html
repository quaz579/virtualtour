<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>VirtualTour avatar steps fixture</title>
    <style>
      body {
        margin: 0;
        height: 700px;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      .t {
        position: absolute;
        box-sizing: border-box;
        width: 160px;
        height: 40px;
        margin: 0;
        border: 1px solid #888;
      }
      #right {
        left: 1000px;
        top: 200px;
      }
      #below {
        left: 560px;
        top: 560px;
      }
      #action {
        left: 560px;
        top: 300px;
      }
    </style>
  </head>
  <body>
    <h1 style="margin: 8px 20px">Avatar steps fixture</h1>
    <button id="trigger">Start tour</button>
    <button id="elsewhere">Elsewhere</button>
    <button class="t" id="right">Right target</button>
    <button class="t" id="below">Lower target</button>
    <button class="t" id="action">Click me</button>

    <script type="module" src="./avatar-steps.ts"></script>
  </body>
</html>
