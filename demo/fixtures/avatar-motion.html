    <style>
      body {
        margin: 0;
        height: 700px;

        position: absolute;
        box-sizing: border-box;
        width: 160px;
        height: 40px;

      #one {
        left: 200px;
        top: 200px;
      }
      #two {

        top: 450px;
      }

  <body>
    <h1 style="margin: 8px 20px">Avatar motion fixture</h1>
    <button class="t" id="one">One</button>
    <button class="t" id="two">Two</button>
